<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Gifts & Redeem Code</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
  background:
    radial-gradient(ellipse at top, #5421a5 0%, transparent 55%),
    linear-gradient(145deg, #090516, #18072f, #070510);
}

.container {
  width: 100%;
  max-width: 430px;
  padding: 32px 22px;
  border: 1px solid rgba(205, 161, 255, .3);
  border-radius: 28px;
  background: rgba(255,255,255,.055);
  box-shadow: 0 0 45px rgba(143, 58, 255, .2);
}

.logo {
  width: 155px;
  height: 155px;
  margin: 0 auto 28px;
  border-radius: 35px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: linear-gradient(145deg, #ffdf76, #ff9c16, #ed5c00);
  box-shadow:
    0 0 35px rgba(255, 171, 38, .45),
    inset 0 3px 8px rgba(255,255,255,.55);
  transform: rotate(-4deg);
}

.logo::before {
  content: "";
  position: absolute;
  inset: 8px;
  border: 2px solid rgba(255,255,255,.65);
  border-radius: 28px;
}

.gift-icon {
  font-size: 90px;
  filter: drop-shadow(0 7px 4px rgba(100, 35, 0, .3));
  transform: rotate(4deg);
}

h1 {
  font-size: clamp(32px, 9vw, 43px);
  font-weight: 1000;
  line-height: 1.15;
  letter-spacing: 1px;
  margin-bottom: 28px;
  color: #fff0a8;
  text-shadow: 0 0 15px rgba(255, 182, 45, .5);
}

h1 span {
  color: #ffffff;
}

.join-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 70px;
  padding: 16px 10px;
  border: 2px solid #aaffd0;
  border-radius: 17px;
  background: linear-gradient(135deg, #38ff91, #00d85b, #009b43);
  color: #ffffff;
  text-decoration: none;
  font-size: clamp(16px, 4.5vw, 20px);
  font-weight: 1000;
  letter-spacing: .5px;
  text-shadow: 0 2px 5px rgba(0, 70, 30, .6);
  box-shadow:
    0 0 12px #00ff88,
    0 0 28px rgba(0, 255, 136, .65),
    inset 0 2px 8px rgba(255,255,255,.4);
  animation: glow 1.4s ease-in-out infinite alternate;
  transition: transform .2s;
}

.join-btn:hover {
  transform: translateY(-3px) scale(1.02);
}

.join-btn:focus-visible {
  outline: 3px solid white;
  outline-offset: 4px;
}

@keyframes glow {
  from {
    box-shadow:
      0 0 10px #00ff88,
      0 0 20px rgba(0,255,136,.4);
  }
  to {
    box-shadow:
      0 0 20px #00ff88,
      0 0 38px rgba(0,255,136,.85);
  }
}

.whatsapp-icon {
  width: 29px;
  height: 29px;
  flex-shrink: 0;
}

@media (max-width: 360px) {
  .container {
    padding: 26px 16px;
  }

  .logo {
    width: 130px;
    height: 130px;
  }

  .gift-icon {
    font-size: 76px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .join-btn {
    animation: none;
    transition: none;
  }
}
</style>
</head>

<body>
<div class="container">

  <div class="logo">
    <div class="gift-icon">🎁</div>
  </div>

  <h1>
    FREE GIFTS<br>
    <span>&amp; REDEEM CODE</span>
  </h1>

  <a class="join-btn"
     href="https://whatsapp.com/channel/0029VbCylnf60eBhYHJBld2Q"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Join our WhatsApp channel">

    <svg class="whatsapp-icon"
         viewBox="0 0 32 32"

    </svg>

    WHATSAPP CHANNEL JOIN
  </a>

</div>
</body>
</html>
